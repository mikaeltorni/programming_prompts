[judge]
judge = "codex"
model = "gpt-5.6-luna"
cwd = "."
timeout = 180
# Editable system prompt for the LLM verifier. Must keep the {criteria} token.
prompt_template = "judge-prompt.md"

[[criterion]]
description = """
Open calculator.py and inspect its functions.

Does every function follow single responsibility (one clear job / one reason
to change)?

Answer yes only if no function mixes unrelated concerns such as parsing input,
performing arithmetic, printing/logging, and formatting the return value in
the same function body.

Answer no if any function clearly violates single responsibility.
Ignore comment wording and string-literal language completely.
If unsure, answer no.
"""
type = "binary"

[scoring]
aggregation = "all_pass"
