# Reward Kit harness config only — edit the prompt in judge-prompt.md.
# Harbor/Reward Kit require this toml to wire the Codex judge; the human-facing
# evaluation wording lives in judge-prompt.md (must keep the {criteria} token).

[judge]
judge = "codex"
model = "gpt-5.6-luna"
cwd = "."
timeout = 180
prompt_template = "judge-prompt.md"

[[criterion]]
name = "single_responsibility"
description = "calculator.py uses single-responsibility functions/methods"
type = "binary"

[scoring]
aggregation = "all_pass"
