# Reward Kit harness config only — edit the prompt in judge-prompt.md.
# Keep the {criteria} token in judge-prompt.md.

[judge]
judge = "codex"
model = "gpt-5.6-luna"
cwd = "."
timeout = 180
prompt_template = "judge-prompt.md"

[[criterion]]
name = "function_commenting"
description = "functions document description, Args, and Returns"
type = "binary"

[scoring]
aggregation = "all_pass"
