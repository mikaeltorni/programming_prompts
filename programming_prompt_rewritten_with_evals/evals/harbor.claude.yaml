# Example Harbor config for Claude Code rewritten-prompt evals.
# Prefer ./run_benchmark.sh harness=cc — it materializes tasks/, isolates judges,
# and wires BenchmarkClaudeCode with the pinned CLI version.
#
#   ./run_benchmark.sh harness=cc --skills commenting,commits,debug,docs,logging,srp,testing,worktree -k 5
#   ./run_benchmark.sh --harness cc --baseline --skills commenting,commits,debug,docs,logging,srp,testing,worktree -k 5

agents:
  - import_path: harbor_agents.benchmark_claude_code:BenchmarkClaudeCode
    model_name: claude-opus-5
    skills:
      - ../prompts/programming-skills/commenting
      - ../prompts/programming-skills/commits
      - ../prompts/programming-skills/debug
      - ../prompts/programming-skills/docs
      - ../prompts/programming-skills/logging
      - ../prompts/programming-skills/srp
      - ../prompts/programming-skills/testing
      - ../prompts/programming-skills/worktree
    kwargs:
      version: "2.1.241"
      reasoning_effort: low

tasks: []
