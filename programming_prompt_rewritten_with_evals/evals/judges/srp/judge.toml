# Independent semantic dimensions of the same SRP policy; all must pass.
[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "parsing_dispatch"
description = "from the first authored working slice, public dispatch crosses one parsing boundary and forwards converted arguments unchanged; form parsers may compose inside it; business calculations/classifications and mutations occur in a separately called operation, never a public-dispatch branch, including zero-operand queries; calling a validator there does not make that branch an operation helper"
type = "binary"

[[criterion]]
name = "domain_validation"
description = "every current converted-value/resource acceptance predicate and rejection belongs to a validator called by its operation, even for one caller or branch; inline operation guards, parser domain filters and operation-specific dispatch guards fail; trace actual callers, not predicate presence alone"
type = "binary"

[[criterion]]
name = "shared_decisions"
description = "compare every inline guard and shared helper across related operations; semantically identical decisions, including common subconditions with corresponding available/requested roles, have one shared called owner in each revision; different resource identities, variable names or subsequent mutations do not make the same acceptance rule distinct"
type = "binary"

[scoring]
aggregation = "all_pass"
