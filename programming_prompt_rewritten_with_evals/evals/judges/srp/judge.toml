# Reward Kit harness config only — edit the prompt in prompt.md.
# Keep the {criteria} token in prompt.md.

[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 180
prompt_template = "prompt.md"

[[criterion]]
name = "single_responsibility"
description = "raw-command parsing and token conversion, operations and thin public dispatch have separate owners from the first slice; genuinely identical domain decisions are shared, distinct arithmetic is not forced together; changes are focused"
type = "binary"

[scoring]
aggregation = "all_pass"
