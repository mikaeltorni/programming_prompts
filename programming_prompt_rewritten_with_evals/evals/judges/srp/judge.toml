# Reward Kit harness config only — edit the prompt in prompt.md.
# Keep the {criteria} token in prompt.md.

[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 180
prompt_template = "prompt.md"

[[criterion]]
name = "single_responsibility"
description = "compare actual operation helper bodies: shared classifications/calculations have one called owner rather than copied equivalent decisions with different labels; preserve already-converted argument types across dispatch; workspace Python uses single-responsibility functions/methods and evolves simple working code through focused necessary edits at requested stages"
type = "binary"

[scoring]
aggregation = "all_pass"
