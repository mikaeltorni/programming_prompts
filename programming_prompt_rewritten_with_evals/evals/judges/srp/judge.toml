# Independent semantic dimensions of the same SRP policy; all must pass.
[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "parsing_dispatch"
description = "from the first authored working slice, public dispatch crosses one parsing boundary and routes converted arguments unchanged; form parsers may compose inside that boundary with raw input; calculations/mutations remain in operation helpers and growth is focused"
type = "binary"

[[criterion]]
name = "domain_validation"
description = "trace callers of converted-value domain predicates: validators called by operations are correct, while parser/conversion callers or operation-specific guards in dispatch fail; predicate presence alone is not a violation, and input-validity wording never makes a domain rule syntax"
type = "binary"

[[criterion]]
name = "shared_decisions"
description = "compare every inline guard and shared helper across related operations; semantically identical decisions, including common subconditions with corresponding available/requested roles, have one shared called owner in each revision; different resource identities, variable names or subsequent mutations do not make the same acceptance rule distinct"
type = "binary"

[scoring]
aggregation = "all_pass"
