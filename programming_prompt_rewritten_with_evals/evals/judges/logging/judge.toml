# Reward Kit harness config only — edit the prompt in prompt.md.
# Keep the {criteria} token in prompt.md.

[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 180
prompt_template = "prompt.md"

[[criterion]]
name = "entry_exit_prints"
description = "every authored or edited function, method, test and fixture uses builtin print for its first named-parameter statement and every complete normal return including implicit None; lambdas and exception exits exempt"
type = "binary"

[scoring]
aggregation = "all_pass"
