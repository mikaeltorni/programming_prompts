# Reward Kit harness config only — edit the prompt in prompt.md.
# Keep the {criteria} token in prompt.md.

[judge]
judge = "codex"
model = "gpt-5.6-luna"
cwd = "."
timeout = 180
prompt_template = "prompt.md"

[[criterion]]
name = "entry_exit_prints"
description = "every def/async def/method prints its named parameters (including optional None) at entry and prints the whole returned value before each return, using builtin print(); lambdas and raise paths exempt"
type = "binary"

[scoring]
aggregation = "all_pass"
