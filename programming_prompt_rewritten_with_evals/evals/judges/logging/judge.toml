# Reward Kit harness config only — edit the prompt in prompt.md.
# Keep the {criteria} token in prompt.md.

[judge]
judge = "codex"
model = "gpt-5.6-luna"
cwd = "."
timeout = 180
prompt_template = "prompt.md"

[[criterion]]
name = "entry_exit_prints"
description = "def/async def/methods print every named parameter (including optional None) by real name at entry, including several names on one print; lambdas need no prints; no-parameter functions any entry print; before each return print the whole returned expression, including every element of a multi-value `return a, b` (ignore raise)"
type = "binary"

[scoring]
aggregation = "all_pass"
