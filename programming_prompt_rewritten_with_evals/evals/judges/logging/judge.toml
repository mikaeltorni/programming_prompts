# Reward Kit harness config only — edit the prompt in prompt.md.
# Keep the {criteria} token in prompt.md.

[judge]
judge = "codex"
model = "gpt-5.6-luna"
cwd = "."
timeout = 180
prompt_template = "prompt.md"

[[criterion]]
name = "entry_exit_prints"
description = "named parameters printed by real name at entry; no-parameter functions any entry print (parameters=none is yes); print return values before each return (ignore raise)"
type = "binary"

[scoring]
aggregation = "all_pass"
