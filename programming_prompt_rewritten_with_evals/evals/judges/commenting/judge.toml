# Reward Kit harness config only — edit the prompt in prompt.md.
# Keep the {criteria} token in prompt.md.

[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 180
prompt_template = "prompt.md"

[[criterion]]
name = "function_commenting"
description = "every authored or edited function, method, test and fixture documents purpose and all parameter/return meanings with same-line Parameters: and Returns: content; lambdas exempt"
type = "binary"

[scoring]
aggregation = "all_pass"
