# Semantic judge — the shared LLM runner inspects the workflow artifacts and history.

[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "workflow_sequence"
description = "the agent performs the required plan action for this turn and preserves prior evidence; implementation and delivery requirements apply when authorized and selected"
type = "binary"

[scoring]
aggregation = "all_pass"
