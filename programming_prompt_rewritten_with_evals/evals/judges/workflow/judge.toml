# Semantic judge — the shared LLM runner inspects the workflow artifacts and history.

[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "workflow_sequence"
description = "the authoritative ACC-compatible plan follows four outer stages and per-feature checks/code/conventional-commit cycles, records actual progress/hashes, completes selected delivery and documents afterward; companion obligations apply only when selected"
type = "binary"

[scoring]
aggregation = "all_pass"
