# Semantic judge — the shared LLM runner inspects the workflow artifacts and history.

[judge]
judge = "codex"
model = "gpt-5.6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "workflow_sequence"
description = "the explicit workflow records a Markdown plan under repository tmp, conditionally follows enabled worktree and docs phases around code writing, skips unavailable or unselected companions, and adds no workflow-owned verification step"
type = "binary"

[scoring]
aggregation = "all_pass"
