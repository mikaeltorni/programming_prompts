# Semantic judge — the shared LLM runner inspects the workflow artifacts and history.

[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "workflow_sequence"
description = "the explicit workflow establishes its selected worktree before planning, records exactly four outer stages and consecutive 3.1 tests, 3.2 code, 3.3 commit rows for each planned feature, closes each cycle before the next, and writes selected documentation afterward"
type = "binary"

[scoring]
aggregation = "all_pass"
