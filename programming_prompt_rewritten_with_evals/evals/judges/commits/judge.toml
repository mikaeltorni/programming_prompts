# Semantic judge — the shared LLM runner inspects the task and implementation.

[judge]
judge = "codex"
model = "gpt-5.6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "feature_commits"
description = "each requested capability is implemented in its own working commit before later capabilities, and that Feature commit subject uses a conventional feat/fix/etc type"
type = "binary"

[scoring]
aggregation = "all_pass"
