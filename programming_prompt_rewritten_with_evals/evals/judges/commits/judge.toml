# Semantic judge — the shared LLM runner inspects the task and implementation.

[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "feature_commits"
description = "each complete original capability sentence has its own faithful ledger entry when supplied, follows tests before implementation, and closes with its own working conventional commit including checks and code before the next capability"
type = "binary"

[scoring]
aggregation = "all_pass"
