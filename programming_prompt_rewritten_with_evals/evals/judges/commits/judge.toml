# Semantic judge — the shared LLM runner inspects the task and implementation.

[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "feature_commits"
description = "each original capability sentence has its own working conventional introducing commit in order, with a faithful capability queue and checks/code/commit cycle; cosmetic ledger text and unavailable chronology alone are not failures"
type = "binary"

[scoring]
aggregation = "all_pass"
