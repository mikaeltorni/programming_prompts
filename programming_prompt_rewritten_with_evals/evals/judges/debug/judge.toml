# Semantic judge — the shared LLM runner inspects the task and implementation.

[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "read_logs_first"
description = "for a reported failure, read original logs before diagnosis/repair, save and run its public regression before code, repair the general behavior and rerun retained checks; no failure is not applicable"
type = "binary"

[scoring]
aggregation = "all_pass"
