# Semantic judge — the shared LLM runner inspects the task and implementation.

[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "read_logs_first"
description = "when the original request reports a failure, verify its log-guided fix; otherwise pass as not applicable"
type = "binary"

[scoring]
aggregation = "all_pass"
