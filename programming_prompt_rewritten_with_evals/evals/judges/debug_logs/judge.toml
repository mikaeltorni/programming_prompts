# Semantic judge — the shared LLM runner inspects the task and implementation.

[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "read_logs_first"
description = "for a reported failure, read available logs before diagnosis/edit and match the logged public contract; no saved regression or commit requirement under this policy alone"
type = "binary"

[scoring]
aggregation = "all_pass"
