# One semantic contract verdict; source and chronological evidence remain available.
[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "testing_contract"
description = "saved public checks precede each capability's code, cover the current contract and retained rules, observe affected state after rejection with isolated cases, and have honest cumulative execution evidence; respect documented direct-check exceptions and report unavailable chronology separately"
type = "binary"

[scoring]
aggregation = "all_pass"
