# Semantic verification judge; the shared runner supplies original task/source.
[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[evidence_prompts]
current = "current.md"
chronology = "chronology.md"

# Limit semantic multitasking while preserving every original metric and case.
[question_batch_sizes]
coverage = 1
preservation = 1

[question_prompts]
coverage = "coverage.md"
preservation = "preservation.md"

[[criterion]]
name = "tests_before_implementation"
evidence_scope = "chronology"
description = "identify every complete capability sentence in the original request; for each in order require saved checks, baseline, only that capability's implementation and PASSING cumulative rerun before saving the next capability's checks; explicitly locate that edit and passing run at EVERY boundary; a later feature baseline cannot close a missing earlier implementation or verification; one all-features baseline followed by an implementation exposing every capability FAILS; absent-entrypoint import failure is a valid creation baseline but does not waive feature separation; earlier mistaken runs corrected before the edit do not invalidate that baseline; require no unselected Git commits or plan; use complete commands and disclose chronology limits"
type = "binary"

[[criterion]]
name = "public_contract_coverage"
evidence_scope = "current"
description = "current saved assertions include blank/unknown dispatch rejections and cover every requested operation and applicable success, boundary, conversion, domain and resource rejection; SELECTED TESTING REQUIRES exact documented operand-shape rejection even when the task states no error semantics: lack of an explicit rejection sentence NEVER waives applicable missing/extra-input cases; zero-operand commands require ONLY extra-operand cases, missing operands are INAPPLICABLE to them, and blank/unknown dispatch does not cover extra operands; group by actual validation owners first; a saved representative rejection marks ALL members of one shared shape predicate COVERED, with no duplicate cases required; grouped complete token forms of the same arity are ONE shape owner even when their rejection falls through to a later raise; a common fallback raise alone does not share independent shape predicates; intentional replacements retire only obsolete expectations"
type = "binary"

[[criterion]]
name = "state_preservation_isolation"
evidence_scope = "current"
description = "every retained rejection loading the CURRENT module immediately observes required affected state/history through CURRENT public READ-ONLY queries before any mutation; a state-changing command returning the new value is still a MUTATION and cannot substitute for an available read, including older methods written before those queries existed; later separate query-aware tests do not repair older retained blocks; cases start fresh; stateless contracts pass"
type = "binary"

[[criterion]]
name = "recorded_execution"
evidence_scope = "chronology"
description = "saved runnable behavioral checks have a usable cumulative current runner and observed nonzero assertions, with execution limits stated honestly and infrastructure distinguished from defects"
type = "binary"

[scoring]
aggregation = "all_pass"
