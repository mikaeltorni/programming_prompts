[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "testing_contract"
description = "Runnable tests cover the requested behavior with independent correct expectations, relevant errors and stateful cases; the final relevant suite actually runs and passes, with honest limits."
type = "binary"

[scoring]
aggregation = "all_pass"
