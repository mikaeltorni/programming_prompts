# Independent semantic dimensions; all must pass the same testing contract.
[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "current_coverage"
description = "current runnable public assertions cover requested successes, policy-required grammar/numeric rejections and only request/log-required domain/resource failures across all retained files; generated README restrictions and implementation guards never create required domain cases"
type = "binary"

[[criterion]]
name = "rejection_preservation"
description = "every current mutable rejection has meaningful public seeding and immediate asserted affected-value and required-history reads using all currently available queries, including retained creation/malformed checks; stateless and valid empty-domain exemptions remain valid"
type = "binary"

[[criterion]]
name = "checks_execution"
description = "saved public checks and new-read upgrades precede each capability's code, followed by actual isolated cumulative execution after the last application/check edit and before later capability checks; documentation-only edits need no rerun; unavailable chronology alone is a reported limit, never a demonstrated no"
type = "binary"

[scoring]
aggregation = "all_pass"
