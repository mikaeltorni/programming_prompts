# Semantic verification judge; the shared runner supplies original task/source.
[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "meaningful_verification"
description = "saved public-interface checks cover requested capabilities and explicitly required validation classes, use effective isolation fixtures, and match the current contract with honest execution evidence"
type = "binary"

[scoring]
aggregation = "all_pass"
