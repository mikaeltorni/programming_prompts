# Semantic verification judge; the shared runner supplies original task/source.
[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[evidence_prompts]
current = "current.md"
chronology = "chronology.md"

# Limit semantic multitasking while preserving every original metric and case.
[question_batch_sizes]
preservation = 1

[question_prompts]
coverage = "coverage.md"
preservation = "preservation.md"

[[criterion]]
name = "tests_before_implementation"
evidence_scope = "chronology"
description = "identify every complete capability sentence in the original request; for each in order require saved checks, baseline, only that capability's implementation and PASSING cumulative rerun before saving the next capability's checks; explicitly locate that edit and passing run at EVERY boundary; a later feature baseline cannot close a missing earlier implementation or verification; one all-features baseline followed by an implementation exposing every capability FAILS; absent-entrypoint import failure is a valid creation baseline but does not waive feature separation; earlier mistaken runs corrected before the edit do not invalidate that baseline; require no unselected Git commits or plan; use complete commands and disclose chronology limits"
type = "binary"

[[criterion]]
name = "public_contract_coverage"
evidence_scope = "current"
description = "current runnable assertions independently cover every requested capability and applicable success, boundary, argument-shape, conversion, domain and resource rejection; intentional replacements retire only obsolete expectations"
type = "binary"

[[criterion]]
name = "state_preservation_isolation"
evidence_scope = "current"
description = "every retained rejection loading the CURRENT module immediately observes required affected state/history through CURRENT public queries, including older methods written before those queries existed; later separate query-aware tests do not repair older retained blocks; cases start fresh; stateless contracts pass"
type = "binary"

[[criterion]]
name = "recorded_execution"
evidence_scope = "chronology"
description = "saved runnable behavioral checks have a usable cumulative current runner and observed nonzero assertions, with execution limits stated honestly and infrastructure distinguished from defects"
type = "binary"

[scoring]
aggregation = "all_pass"
