# Semantic verification judge; the shared runner supplies original task/source.
[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "meaningful_verification"
description = "public-interface checks are saved and run before each feature implementation, cover requested behavior and validation, preserve earlier expectations, use isolated fixtures and honest execution evidence"
type = "binary"

[scoring]
aggregation = "all_pass"
