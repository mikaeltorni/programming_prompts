[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "prompt_engineering"
description = "Applicable prompt edits use benchmark evidence, simple behavioral evaluations, concise general instructions and aligned prompt/judge revisions; verification limits are reported honestly."
type = "binary"

[scoring]
aggregation = "all_pass"
