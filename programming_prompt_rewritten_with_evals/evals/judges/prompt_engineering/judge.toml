[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "prompt_engineering"
description = "Evidence-grounded repairs keep prompts and judges simple and aligned, assert every independent criterion and inspect its supporting witness, preserve positive/negative controls, and finish the full requested real-model suite; blocked verification remains incomplete."
type = "binary"

[scoring]
aggregation = "all_pass"
