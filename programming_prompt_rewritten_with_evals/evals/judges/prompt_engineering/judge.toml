[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "prompt_engineering"
description = "Prompt creation or evidence-grounded repair keeps prompts and judges simple and aligned, uses a saved runnable evaluation with real main/judge calls, checks every independent criterion and positive/negative control, and completes requested coverage under the user's acceptance criteria; terminal-only calls and blocked verification remain incomplete."
type = "binary"

[scoring]
aggregation = "all_pass"
