[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "prompt_engineering"
description = "Prompt and judge stay simple and aligned, reuse benchmark evidence or create a missing suite, and finish every saved main/judge case plus one fixed incorrect control with runner-checked verdicts; mismatches require paired repair and unfinished checks remain unverified."
type = "binary"

[scoring]
aggregation = "all_pass"
