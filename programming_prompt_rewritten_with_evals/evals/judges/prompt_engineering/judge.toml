[judge]
judge = "codex"
model = "gpt-6-luna"
cwd = "."
timeout = 240
prompt_template = "prompt.md"

[[criterion]]
name = "prompt_engineering"
description = "Prompt and judge stay simple and aligned, reuse benchmark evidence or create a missing suite, and pass actual model evaluations and correct/incorrect judge controls; unfinished checks remain unverified."
type = "binary"

[scoring]
aggregation = "all_pass"
