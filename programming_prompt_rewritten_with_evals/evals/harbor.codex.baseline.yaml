# Reference baseline config (no skills). Prefer:
#   ./run_codex_benchmark.sh --baseline --skills srp,commenting -k 5 -n 5
# Judges for the selected skills still score the written code.

agents:
  - import_path: harbor_agents.benchmark_codex:BenchmarkCodex
    model_name: openai/gpt-5.6-luna
    skills: []
    kwargs:
      version: "0.147.0"
      reasoning_effort: low

tasks:
  - path: tasks/calculator
  - path: tasks/counter
  - path: tasks/greeter
  - path: tasks/temperature
  - path: tasks/todo
