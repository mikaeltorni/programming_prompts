# Harbor job config for rewritten-prompt Codex benchmarks.
#
# Default agent model: openai/gpt-5.6-luna with reasoning_effort=low.
# Always uses BenchmarkCodex: a fresh CODEX_HOME per trial, skill discovery
# paths wiped, and only the skills listed below installed. Codex CLI version
# comes from kwargs.version (keep in sync with evals/codex-version.txt).
#
# From evals/ (five concurrent Luna-low trials):
#   ./run_codex_benchmark.sh --job-name codex-finnish -k 5 -n 5
#
# Override model/effort on the CLI, e.g.:
#   ./run_codex_benchmark.sh -m openai/gpt-5.4 --ak reasoning_effort=medium -k 1

agents:
  - import_path: harbor_agents.benchmark_codex:BenchmarkCodex
    model_name: openai/gpt-5.6-luna
    skills:
      - ../prompts/programming-skill
    kwargs:
      version: "0.147.0"
      reasoning_effort: low

tasks:
  - path: tasks/calculator-comments
