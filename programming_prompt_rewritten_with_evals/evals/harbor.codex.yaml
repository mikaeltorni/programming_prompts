# Reference Harbor job config (documentation / bare `harbor -c` use).
# Prefer ./run_codex_benchmark.sh — it materializes tasks/ from coding-prompts/,
# discovers selected skills under ../prompts/programming-skills/, syncs judges,
# and keeps gpt-5.6-luna at low reasoning effort.
#
#   ./run_codex_benchmark.sh --skills srp,commenting -k 5 -n 5
#   ./sync_tasks.sh && harbor run -c harbor.codex.yaml …

agents:
  - import_path: harbor_agents.benchmark_codex:BenchmarkCodex
    model_name: openai/gpt-5.6-luna
    skills:
      - ../prompts/programming-skills/srp
      - ../prompts/programming-skills/commenting
    kwargs:
      version: "0.147.0"
      reasoning_effort: low

tasks:
  - path: tasks/calculator
  - path: tasks/counter
  - path: tasks/greeter
  - path: tasks/temperature
  - path: tasks/todo
