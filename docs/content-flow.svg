<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Programming Prompts content flow</title>
  <desc id="desc">Programming Prompts provides plugin prompts, direct skills, and dispatch skills that coding agents and the installer can load.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1280" height="640" rx="28" fill="#f6f8fa"/>
  <text x="640" y="70" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#24292f">How Programming Prompts is consumed</text>
  <rect x="55" y="245" width="265" height="150" rx="18" fill="#0969da"/>
  <text x="188" y="305" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="white">Programming Prompts</text>
  <text x="188" y="340" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">canonical content source</text>
  <rect x="390" y="130" width="300" height="105" rx="16" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/>
  <text x="540" y="173" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#0550ae">Plugin prompts</text>
  <text x="540" y="205" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#24292f">Codex and Claude manifests</text>
  <rect x="390" y="268" width="300" height="105" rx="16" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/>
  <text x="540" y="311" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#0550ae">Direct skills</text>
  <text x="540" y="343" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#24292f">reusable SKILL.md workflows</text>
  <rect x="390" y="406" width="300" height="105" rx="16" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/>
  <text x="540" y="449" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#0550ae">Dispatch skills</text>
  <text x="540" y="481" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#24292f">task prompt plus scorecard</text>
  <line x1="320" y1="320" x2="385" y2="182" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="320" y1="320" x2="385" y2="320" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="320" y1="320" x2="385" y2="458" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="805" y="245" width="365" height="150" rx="18" fill="#1a7f37"/>
  <text x="988" y="300" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="white">Agent or installer</text>
  <text x="988" y="337" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">loads the selected prompt</text>
  <line x1="690" y1="182" x2="800" y2="285" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="690" y1="320" x2="800" y2="320" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="690" y1="458" x2="800" y2="355" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
